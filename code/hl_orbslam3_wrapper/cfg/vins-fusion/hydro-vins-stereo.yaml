%YAML:1.0

#common parameters
#support: 1 imu 1 cam; 1 imu 2 cam: 2 cam; 
imu: 1
num_of_cam: 2

imu_topic: "/imu"
image0_topic: "/spot/camera/frontleft/image"
image1_topic: "/spot/camera/frontright/image"
output_path: "/user/vins-stereo/output/"

cam0_calib: "hydro-cam0.yaml"
cam1_calib: "hydro-cam1.yaml"
image_width: 480
image_height: 640

# Extrinsic parameter between IMU and Camera.
estimate_extrinsic: 0   # 0  Have an accurate extrinsic parameters. We will trust the following imu^R_cam, imu^T_cam, don't change it.
                        # 1  Have an initial guess about extrinsic parameters. We will optimize around your initial guess.

# Transformation from frontleft_fisheye to kinect_imu_link
body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [0.40904351, -0.47356571, -0.78001213,  0.104,
          0.01599446,  0.85838338, -0.51275934,  0.04,
          0.91237469,  0.19726501,  0.35869058,  0.163,
          0.        ,  0.        ,  0.        ,  1.]

body_T_cam1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ 0.40538679,  0.47504183, -0.78102292,  0.10100961,
           0.010018  ,  0.85201515,  0.52342126, -0.03473967,
           0.91409036, -0.22001235,  0.34063672,  0.16674695,
           0.        ,  0.        ,  0.        ,  1.        ]

#Multiple thread support
multiple_thread: 0      # so that we can log timing

#feature tracker parameters
max_cnt: 1000           # max feature number in feature tracking
min_dist: 30            # min distance between two features 
freq: 0                 # frequency (Hz) of publish tracking result. At least 10Hz for good estimation. If set 0, the frequency will be same as raw image 
F_threshold: 1.0        # ransac threshold (pixel)
show_track: 1           # publish tracking image as topic
flow_back: 1            # perform forward and backward optical flow to improve feature tracking accuracy

#optimization parameters
max_solver_time: 0.05    # max solver itration time (ms), to guarantee real time
max_num_iterations: 8   # max solver itrations, to guarantee real time
keyframe_parallax: 10.0 # keyframe selection threshold (pixel)

#imu parameters     The more accurate parameters you provide, the better performance
acc_n: 4.0e-2       # accelerometer measurement noise standard deviation. 
gyr_n: 1.0e-3       # gyroscope measurement noise standard deviation.     
acc_w: 4.0e-2       # accelerometer bias random walk noise standard deviation.  
gyr_w: 1.0e-3       # gyroscope bias random walk noise standard deviation.     
g_norm: 9.81007     # gravity magnitude

#unsynchronization parameters
estimate_td: 1            # online estimate time offset between camera and imu
td: 0.                    # initial value of time offset. unit: s. readed image clock + td = real image clock (IMU clock)

#loop closure parameters
load_previous_pose_graph: 0        # load and reuse previous pose graph; load from 'pose_graph_save_path'
pose_graph_save_path: /user/vins-mono/output/pose_graph/" # save and load path
save_image: 1                   # save image in pose graph for visualization prupose; you can close this function by setting 0 
