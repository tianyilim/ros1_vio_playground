%YAML:1.0

#common parameters
#support: 1 imu 1 cam; 1 imu 2 cam: 2 cam; 
imu: 1
num_of_cam: 2

imu_topic: "/imu/data"
image0_topic: "/camera_left/image_raw"
image1_topic: "/camera_right/image_raw"
output_path: "/user/vins-stereo/output/"

cam0_calib: "vbr-cam-left.yaml"
cam1_calib: "vbr-cam-right.yaml"
image_width: 1388
image_height: 700

# Extrinsic parameter between IMU and Camera.
estimate_extrinsic: 0   # 0  Have an accurate extrinsic parameters. We will trust the following imu^R_cam, imu^T_cam, don't change it.
                        # 1  Have an initial guess about extrinsic parameters. We will optimize around your initial guess.

# Transformation from frontleft_fisheye to kinect_imu_link
body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ 0.037625047406, -0.007947906881, 0.999260319728, 0.108169265686,
          -0.999241088127, -0.010385921748, 0.037541715839, 0.245263320981,
           0.010079861425, -0.999914478046, -0.008332645918, -0.060574570772,
           0.000000000000, 0.000000000000, 0.000000000000, 1.000000000000]
body_T_cam1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ 0.047533765306, 0.002997724519, 0.998865133441, 0.117518620394,
          -0.998851236543, -0.005926227938, 0.047550889366, -0.235758955147,
           0.006062046927, -0.999977946492, 0.002712584915, -0.066699484195,
           0.000000000000, 0.000000000000, 0.000000000000, 1.000000000000]


#Multiple thread support
multiple_thread: 0  # disable to log timing

#feature tracker parameters
max_cnt: 1000           # max feature number in feature tracking
min_dist: 30            # min distance between two features 
freq: 0                 # frequency (Hz) of publish tracking result. At least 10Hz for good estimation. If set 0, the frequency will be same as raw image 
F_threshold: 1.0        # ransac threshold (pixel)
show_track: 1           # publish tracking image as topic
flow_back: 1            # perform forward and backward optical flow to improve feature tracking accuracy

#optimization parameters
max_solver_time: 0.03   # max solver itration time (ms), to guarantee real time
max_num_iterations: 8   # max solver itrations, to guarantee real time
keyframe_parallax: 10.0 # keyframe selection threshold (pixel)

#imu parameters     The more accurate parameters you provide, the better performance
acc_n: 0.001602090212250569     # accelerometer measurement noise standard deviation. 
gyr_n: 0.00013361278165885748   # gyroscope measurement noise standard deviation.     
acc_w: 1.4361954439703917e-05   # accelerometer bias random walk noise standard deviation.  
gyr_w: 3.1760920521174444e-06   # gyroscope bias random walk noise standard deviation.     
g_norm: 9.81                    # gravity magnitude

#unsynchronization parameters
estimate_td: 0            # online estimate time offset between camera and imu
td: 0.0014439866415333613 # initial value of time offset. unit: s. readed image clock + td = real image clock (IMU clock)

#loop closure parameters
load_previous_pose_graph: 0 # load and reuse previous pose graph; load from 'pose_graph_save_path'
save_image: 0               # save image in pose graph for visualization prupose; you can close this function by setting 0 
pose_graph_save_path: /user/vins-mono/output/pose_graph/" # save and load path
